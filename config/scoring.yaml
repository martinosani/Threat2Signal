      description: "Kernel-mode component"
      component_patterns: ["Windows Kernel", "win32k", "CLFS", "Common Log File",
                           "NTFS", "Windows Driver", "AppContainer"]
    remote_preauth:
      description: "Network-reachable without authentication"
      requires: { av: "N", pr: "N" }
    scope_change:
      description: "Sandbox or VM escape (Scope:Changed)"
      requires: { scope: "Changed" }
    novel:
      description: "No public exploit or disclosure"
      requires: { exploited_wild: false, publicly_disclosed: false, kev_listed: false }
    patchable:
      description: "KB patches available for binary diffing"
      requires: { has_kb_entries: true }
    high_impact:
      description: "Remote Code Execution or Elevation of Privilege"
      impact_values: ["Remote Code Execution", "Elevation of Privilege"]
    info_leak:
      description: "Information disclosure (ASLR/KASLR bypass potential)"
      impact_values: ["Information Disclosure"]
