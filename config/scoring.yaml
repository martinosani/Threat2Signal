vr_scoring:

  # Components weighted for user-mode heap exploitation research:
  # parsers, scripting engines, renderers, and COM/RPC surfaces score highest;
  # kernel-mode components are demoted (different allocator, different research).
  components:
    # --- Tier 1: user-mode heap-heavy attack surfaces (38) ---
    "MSHTML":                         38
    "JScript":                        38
    "Scripting Engine":               38
    "Chakra":                         38
    "Microsoft Graphics Component":   38

    # --- Tier 2: parsers, renderers, RPC/COM surfaces (32-36) ---
    "Windows GDI":                    36
    "DirectWrite":                    35
    "Windows Font":                   35
    "OpenType":                       35
    "TrueType":                       35
    "Windows Uniscribe":              35
    "Internet Explorer":              35
    "Windows OLE":                    32
    "Windows Codecs Library":         32
    "Windows Imaging Component":      32
    "HEVC Video Extensions":          32
    "AV1 Video Extension":            32
    "Microsoft Outlook":              32
    "Microsoft Office":               32
    "Microsoft Word":                 32
    "Microsoft Excel":                32
    "Windows RPC":                    30
    "Remote Procedure Call":          30
    "Windows DCOM":                   30
    "Windows COM":                    30
    "Windows Script":                 30
    "Windows DNS":                    30
    "Microsoft Edge":                 30
    "Rich Text":                      30
    "Windows Shell":                  30

    # --- Tier 3: network/messaging surfaces with heap usage (25-28) ---
    "Windows TCP/IP":                 28
    "Windows SMB":                    28
    "LDAP":                           28
    "Windows HTTP":                   28
    "Windows Media":                  28
    "Windows Print Spooler":          25
    "Windows Task Scheduler":         25
    "Windows Installer":              25
    "Windows Message Queuing":        25
    "Windows DHCP":                   25
    "Windows Defender":               25
    "Windows XPS":                    25
    "Windows Compressed Folder":      28

    # --- Tier 4: auth/token/security surfaces (20-25) ---
    "Windows Token":                  22
    "Windows LSA":                    22
    "Windows SAM":                    22
    "Kerberos":                       22
    "Windows NTLM":                   22
    "Windows ACL":                    20
    "Windows Authentication":         20
    "Windows Credentials":            20
    "Windows Security":               18
    "Windows Storage":                18
    "Windows Fax":                    22
    "Windows Address Book":           22
    "Windows Contacts":               22

    # --- Tier 5: kernel-mode (demoted — not user-mode heap) ---
    "win32k":                         15
    "Windows AppContainer":           15
    "Windows Kernel":                  8
    "Windows Common Log File System": 10
    "Windows CLFS":                   10
    "NTFS":                           10
    "Windows Driver":                  5
    "Windows Hyper-V":                 8

  catchall_categories:
    "Azure":          3
    "Visual Studio":  8
    "SQL Server":     5
    "SharePoint":     5
    "Exchange":       5
    "Teams":          8
    "OneDrive":       8

  default_component_score: 5

  cwe_weights:
    "CWE-122": 22    # Heap-based Buffer Overflow
    "CWE-787": 22    # Out-of-bounds Write
    "CWE-416": 22    # Use After Free
    "CWE-415": 22    # Double Free
    "CWE-190": 20    # Integer Overflow (heap size calc corruption)
    "CWE-843": 20    # Type Confusion (object replacement in heap spray)
    "CWE-191": 18    # Integer Underflow
    "CWE-125": 16    # Out-of-bounds Read (info leak for ASLR bypass)
    "CWE-119": 16    # Buffer Overflow (generic)
    "CWE-362": 16    # Race Condition (races on heap objects -> UAF)
    "CWE-120": 14    # Classic Buffer Overflow
    "CWE-121": 14    # Stack-based Buffer Overflow
    "CWE-476":  6    # NULL Pointer Deref (rarely exploitable for heap research)
    "CWE-77":  10    # Command Injection
    "CWE-78":  10    # OS Command Injection
    "CWE-502":  8    # Deserialization
    "CWE-20":   8    # Improper Input Validation
    "CWE-269":  3    # Improper Privilege Management (logic, not heap)
    "CWE-287":  2    # Improper Authentication (logic, not heap)

  impact_weights:
    "Remote Code Execution":    18
    "Elevation of Privilege":   16
    "Security Feature Bypass":  10
    "Information Disclosure":   14   # Info leaks critical for heap ASLR bypass chaining
    "Denial of Service":         4
    "Spoofing":                  3

  attack_vector_weights:
    "N": 15
    "A": 10
    "L":  8
    "P":  2

  privileges_required_weights:
    "N": 12
    "L":  6
    "H":  0

  user_interaction_weights:
    "N": 8
    "R": 4

  bonuses:
    customer_action_required:  15
    exploit_unproven:           5
    exploit_poc:              -10    # Deferred: no schema signal for PoC detection yet; treated as exploit_unproven
    exploit_active:           -15    # Reduced penalty: active heap exploits are instructive for technique study
    publicly_disclosed:        -5
    critical_severity:         10    # Critical + mem_corrupt = higher chance of RCE-grade heap bug
    important_severity:         3
    scope_changed:             12

  thresholds:
    PRIME:  100
    HIGH:    70
    MEDIUM:  45
    LOW:     20

  tag_rules:
    mem_corrupt:
      description: "Memory corruption bug class"
      cwe_ids: ["CWE-122", "CWE-787", "CWE-416", "CWE-190", "CWE-843", "CWE-415",
                 "CWE-191", "CWE-125", "CWE-119", "CWE-120", "CWE-121", "CWE-362"]
    heap_corrupt:
      description: "Heap-specific corruption (overflow, UAF, double free, type confusion)"
      cwe_ids: ["CWE-122", "CWE-416", "CWE-415", "CWE-843", "CWE-787", "CWE-190", "CWE-191"]
    user_mode_parser:
      description: "User-mode parsing component (heap-heavy attack surface)"
      component_patterns: ["MSHTML", "JScript", "Scripting Engine", "Chakra",
                           "Graphics Component", "GDI", "DirectWrite", "Font",
                           "OpenType", "TrueType", "Uniscribe", "Codecs",
                           "Imaging Component", "HEVC", "AV1", "Windows Media",
                           "Microsoft Office", "Microsoft Word", "Microsoft Excel",
                           "Rich Text", "Internet Explorer", "Windows OLE",
                           "Windows Shell", "Windows Defender", "Windows COM",
                           "Windows Fax", "Windows XPS", "Compressed Folder"]
    kernel:
      description: "Kernel-mode component"
      component_patterns: ["Windows Kernel", "win32k", "CLFS", "Common Log File",
                           "NTFS", "Windows Driver", "AppContainer"]
    remote_preauth:
      description: "Network-reachable without authentication"
      requires: { av: "N", pr: "N" }
    scope_change:
      description: "Sandbox or VM escape (Scope:Changed)"
      requires: { scope: "Changed" }
    novel:
      description: "No public exploit or disclosure"
      requires: { exploited_wild: false, publicly_disclosed: false, kev_listed: false }
    patchable:
      description: "KB patches available for binary diffing"
      requires: { has_kb_entries: true }
    high_impact:
      description: "Remote Code Execution or Elevation of Privilege"
      impact_values: ["Remote Code Execution", "Elevation of Privilege"]
    info_leak:
      description: "Information disclosure (ASLR/KASLR bypass potential)"
      impact_values: ["Information Disclosure"]
